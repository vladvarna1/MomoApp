<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Щадящо меню и рецепти при гастрит">
<meta name="theme-color" content="#6247AA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pissi">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Pissi Food App</title>
<script>try{var c=JSON.parse(localStorage.getItem("layka-look")||"null");if(c){var r=document.documentElement;for(var k in c.vars)r.style.setProperty(k,c.vars[k]);if(c.scheme)r.style.colorScheme=c.scheme;}}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--brand);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.hs{display:flex;gap:8px;max-width:520px}.hs .search{flex:1;min-width:0}
.brand b{font-size:1.45rem}
/* Layout: мобилно приложение с долна навигация; на широк екран – централна колона до 1040px.
   Палитра: лавандула (основен бутон), златисто (акцент), тъмна слива (мастило). */
:root{
  --bg:#F5F2FB; --surface:#FFFFFF; --ink:#2D2650; --muted:#64608A; --line:#E1DBF1;
  --brand:#6247AA; --on-brand:#FFFFFF; --soft:#E9E3F7; --accent2:#F0C14B; --on-accent2:#33270A;
  --ok:#2E7D5B; --ok-bg:#DDF0E4; --lim:#9A6A10; --lim-bg:#FBEFCB; --no:#B04438; --no-bg:#F8DEDA;
  --shadow:0 1px 2px rgba(27,56,50,.06),0 6px 20px rgba(27,56,50,.07);
  --f-display:"Alegreya",Georgia,"Times New Roman",serif; --r:18px; --r-sm:12px; --fs:1;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15121F; --surface:#1E1A2E; --ink:#ECE8F7; --muted:#A9A3C4; --line:#342E4D;
  --brand:#B9A4FF; --on-brand:#1A1030; --soft:#28223D; --accent2:#F0C14B; --on-accent2:#2A2000;
  --ok:#78D0A3; --ok-bg:#1B3528; --lim:#E5B94F; --lim-bg:#3A3015; --no:#EE8D82; --no-bg:#40201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121F; --surface:#1E1A2E; --ink:#ECE8F7; --muted:#A9A3C4; --line:#342E4D;
  --brand:#B9A4FF; --on-brand:#1A1030; --soft:#28223D; --accent2:#F0C14B; --on-accent2:#2A2000;
  --ok:#78D0A3; --ok-bg:#1B3528; --lim:#E5B94F; --lim-bg:#3A3015; --no:#EE8D82; --no-bg:#40201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
html{font-size:calc(16px*var(--fs))}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800}
h2{font-size:1.55rem}
h3{font-size:1.2rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.top .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font:800 1.35rem/1 var(--f-display);display:block}
.brand span{font-size:.72rem;color:var(--muted);display:block}
.chip-set{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px 6px 6px;font-size:.84rem;font-weight:600}
.chip-set i{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--brand)}
.chip-set i svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip-set small{display:block;font-weight:500;color:var(--muted);font-size:.7rem;line-height:1.1}
nav.tabs{display:none}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:600;border-radius:12px}
nav.bottom a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bottom a[aria-current="page"]{color:var(--brand);background:var(--soft)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:19;
  background:var(--accent2);color:var(--on-accent2);border:0;border-radius:99px;padding:13px 18px;font-weight:800;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{padding-top:22px;display:flex;flex-direction:column;gap:30px}
section{min-width:0}

/* buttons & chips */
.btn{border:0;background:var(--brand);color:var(--on-brand);border-radius:var(--r-sm);padding:12px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn.big{padding:17px 26px;font-size:1.12rem;border-radius:var(--r)}
.btn.cham{background:var(--accent2);color:var(--on-accent2)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"],.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--brand)}
.tag.lim{background:var(--lim-bg);color:var(--lim)} .tag.no{background:var(--no-bg);color:var(--no)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.seg{display:inline-flex;background:var(--soft);border-radius:var(--r-sm);padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 16px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}

/* hero */
.hero{display:grid;gap:18px;padding:26px 22px;border-radius:calc(var(--r)*1.5);background:var(--soft);position:relative;overflow:hidden}
.hero p.lead{max-width:46ch;color:var(--muted);font-size:1.05rem}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rules{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.rule{display:flex;gap:12px;align-items:flex-start}
.rule b{font:800 1.6rem/1 var(--f-display);color:var(--brand);min-width:1.4em}

/* recipe cards */
.rcard{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,box-shadow .15s}
.rcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rcard h3{font-size:1.18rem}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.dot{width:4px;height:4px;border-radius:50%;background:var(--muted);display:inline-block}
.mchip{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.mchip.have{border-color:var(--brand);color:var(--brand)}
.filters{display:grid;gap:12px}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:12px 16px;font:inherit}

/* dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(640px,100%);max-height:92dvh;border-radius:calc(var(--r)*1.4) calc(var(--r)*1.4) 0 0;margin:auto auto 0;box-shadow:0 -10px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,25,20,.55)}
@media(min-width:700px){dialog{margin:auto;border-radius:24px;max-height:88dvh}}
.dlg-in{padding:22px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;overflow:auto;max-height:inherit}
.dlg-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.x{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;flex:none;font-size:1.2rem;line-height:1}
.dots{display:flex;gap:6px}.dots i{height:5px;flex:1;border-radius:9px;background:var(--line)}.dots i.on{background:var(--brand)}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--soft)}
.opt small{display:block;font-weight:500;color:var(--muted)}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ings li b{font-variant-numeric:tabular-nums;white-space:nowrap}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:flex;gap:12px}
ol.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--brand);font-weight:800;font-size:.85rem;display:grid;place-items:center;margin-top:1px}
.tipbox{background:var(--lim-bg);color:var(--ink);border-radius:var(--r-sm);padding:12px 14px;font-size:.92rem}
.tipbox b{color:var(--lim)}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:800}

/* planner */
.pday{display:grid;gap:8px}
.pday h3{display:flex;justify-content:space-between;align-items:baseline}
.slot{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.slot .lbl{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slot .nm{background:none;border:0;padding:0;text-align:left;font-weight:700;color:var(--ink);min-width:0}
.slot .nm:hover{color:var(--brand);text-decoration:underline}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--soft);border-radius:var(--r);padding:12px 16px;min-width:120px}
.stat b{display:block;font:800 1.8rem/1 var(--f-display);color:var(--brand)}
.stat span{font-size:.8rem;color:var(--muted)}
.cooks{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.cooks li{display:flex;gap:2px 12px;align-items:baseline;flex-wrap:wrap}
.cooks .d{font-weight:800;color:var(--brand);min-width:7.2em}
.cooks li>span:last-child{flex:1 1 200px;min-width:0}

/* list */
.lgroup h3{margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
.lrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lrow input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.lrow span.q{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow.done span:not(.q){text-decoration:line-through;color:var(--muted)} .lrow.done .q{color:var(--muted);text-decoration:line-through}

/* guide */
.fcat{display:grid;gap:10px}
.fl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fl .lb{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;min-width:84px}
.fi{font-size:.86rem;font-weight:600;padding:3px 10px;border-radius:99px}
.fi.ok{background:var(--ok-bg);color:var(--ok)} .fi.lim{background:var(--lim-bg);color:var(--lim)} .fi.no{background:var(--no-bg);color:var(--no)}
.fi small{font-weight:500;opacity:.85}
table.sub{width:100%;border-collapse:collapse;font-size:.92rem}
table.sub th,table.sub td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.sub th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;font-size:.9rem}
.sw{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sw input{width:46px;height:26px;accent-color:var(--brand);flex:none}
.disc{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:10px}


.micon{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex:none}
.micon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rhead{display:flex;gap:12px;align-items:center;justify-content:space-between}
.heart{border:0;background:transparent;font-size:1.35rem;line-height:1;padding:4px 6px;color:var(--muted);border-radius:50%}
.heart[aria-pressed="true"]{color:var(--no)}
.rwrap{position:relative}.rwrap .heart{position:absolute;top:10px;right:10px}
.more{display:flex;justify-content:center;padding:18px 0}
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.swatches{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.sw-opt{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px;display:grid;gap:8px;text-align:left;font-weight:700}
.sw-opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.sw-prev{height:44px;border-radius:calc(var(--r-sm));display:flex;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.sw-prev i{flex:1}
.pref{font-size:.9rem;font-weight:600;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;display:inline-flex;gap:6px;align-items:center}
.pref.like{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pref.no{background:var(--no-bg);border-color:var(--no);color:var(--no);text-decoration:line-through}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.sticky-note{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5}

.codebox{font:700 1.5rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;background:var(--soft);border-radius:var(--r-sm);padding:12px 16px;text-align:center;user-select:all;word-break:break-all}
.codein{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase}

.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.otter-s{display:block;flex:none}.otter-big{display:none}
@media(min-width:820px){.otter-s{display:none}.otter-big{display:block;position:absolute;right:40px;bottom:26px;opacity:.96}.hero p.lead,.hero .hs{max-width:46ch}}

*,*::before,*::after{font-feature-settings:"locl" 0 !important}
body{padding-block:0 150px}
.fab{transition:transform .2s,opacity .2s}
.fab.hide{transform:translateY(130px);opacity:0;pointer-events:none}
.chip[disabled]{opacity:.4;cursor:not-allowed}

.fld{display:grid;gap:6px;font-weight:600;font-size:.9rem}
.fld .search{font-weight:400}
textarea.search{font:inherit;resize:vertical}
.slot2{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.slot2 .lbl{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:6px}
.its{display:grid;gap:6px;min-width:0}
.it{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.it .nm,.pcard .nm{background:none;border:0;padding:0;text-align:left;font-weight:700;color:var(--ink);min-width:0}
.it .nm:hover,.pcard .nm:hover{color:var(--brand);text-decoration:underline}
.ia{display:flex;gap:4px;align-items:center;flex:none}
.x-sm{border:0;background:transparent;color:var(--muted);font-size:1.25rem;line-height:1;width:32px;height:32px;border-radius:50%}
.x-sm:hover{background:var(--soft);color:var(--no)}
.addb{border:1.5px dashed var(--line);background:transparent;color:var(--brand);font-weight:700;border-radius:var(--r-sm);padding:7px 12px;text-align:left}
.addb:hover{border-color:var(--brand);background:var(--soft)}
.dayh{display:flex;justify-content:space-between;gap:10px}
.dayact{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
ul.an{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.an li{display:flex;gap:10px;align-items:flex-start}
ul.an li b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem}
ul.an li.ok b{background:var(--ok-bg);color:var(--ok)}ul.an li.warn b{background:var(--lim-bg);color:var(--lim)}ul.an li.info b{background:var(--soft);color:var(--brand)}
.plist{display:grid;gap:10px}
.pcard{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.why{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.why span{font-size:.74rem;font-weight:600;background:var(--soft);color:var(--brand);border-radius:99px;padding:2px 9px}
.warnbox{border:2px solid var(--no);background:var(--no-bg);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.warnbox .wh{display:flex;gap:10px;align-items:center;font-weight:800;color:var(--no)}
.warnbox .wg{width:24px;height:24px;border-radius:50%;background:var(--no);color:var(--bg);display:grid;place-items:center;font-weight:800}
.warnbox p{color:var(--ink)}
.nm2{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0;display:grid}
.lrow{cursor:default}
/* правила: три отделни раздела */
.tri{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.trib{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.trib .g{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.trib small{display:block;color:var(--muted);font-weight:500}
.trib.ok .g{background:var(--ok);color:var(--bg)}.trib.lim .g{background:var(--lim);color:var(--bg)}.trib.no .g{background:var(--no);color:var(--bg)}
.trib[aria-pressed="true"].ok{border-color:var(--ok)}.trib[aria-pressed="true"].lim{border-color:var(--lim)}.trib[aria-pressed="true"].no{border-color:var(--no)}
.note{background:var(--soft);border-radius:var(--r-sm);padding:12px 14px;font-size:.92rem}
.gsec{border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.gsec.ok{border-color:var(--ok)}.gsec.lim{border-color:var(--lim)}.gsec.no{border-color:var(--no)}
.gh{display:flex;gap:14px;align-items:flex-start;padding:16px 18px}
.gsec.ok .gh{background:var(--ok-bg)}.gsec.lim .gh{background:var(--lim-bg)}.gsec.no .gh{background:var(--no-bg)}
.gh .g{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 1.2rem var(--f-body);flex:none;color:var(--bg)}
.gsec.ok .g{background:var(--ok)}.gsec.lim .g{background:var(--lim)}.gsec.no .g{background:var(--no)}
.gh h3{font-size:1.35rem}.gh p{font-size:.92rem;color:var(--muted);margin-top:2px}
.gb{display:grid;gap:14px;padding:16px 18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gct{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.gi{display:flex;gap:6px;flex-wrap:wrap}
.fi{font-size:.86rem;font-weight:600;padding:3px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}
.fi b{font-size:.75rem}
.fi.ok{background:var(--ok-bg);color:var(--ok)}.fi.lim{background:var(--lim-bg);color:var(--lim)}.fi.no{background:var(--no-bg);color:var(--no)}
.alarm{border:2px solid var(--no);background:var(--no-bg);border-radius:var(--r);padding:16px 18px}
.alarm ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
@media(min-width:820px){
  body{padding-block:0 60px}
  nav.bottom{display:none}
  nav.tabs{display:flex;gap:4px}
  nav.tabs a{padding:8px 14px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem}
  nav.tabs a[aria-current="page"]{background:var(--soft);color:var(--brand)}
  .fab{bottom:28px}
  .toast{bottom:90px}
  .hero{padding:44px 40px}
  .brand{margin-right:12px}
  .top .wrap .spacer{flex:1}
}
@media(max-width:819px){.chip-set span.t{display:none}.chip-set{padding:4px}.brand span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const KEY="layka-v3";
let STORE_OK=true;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){STORE_OK=false;return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){STORE_OK=false;return false;}}
const DEF=()=>({v:3,equip:{oven:1,air:1,stove:1,steam:0,slow:0,blend:1,micro:0},people:2,dairy:1,red:1,fish:1,gf:0,pref:{},fav:{},
  look:{skin:"auto",fs:1,r:"mid",font:"serif"},cur:null,hist:[],planDays:3,mode:"simple",shop:[],saved:0});
function mergeState(x){const d=DEF();return Object.assign(d,x,{equip:Object.assign(d.equip,x.equip||{}),look:Object.assign(d.look,x.look||{}),pref:x.pref||{},fav:x.fav||{},hist:x.hist||[],shop:x.shop||[]});}
function migrate(o){
  const s=DEF();["equip","people","dairy","red","fish","gf","pref","fav","look","planDays","mode"].forEach(k=>{if(o[k]!==undefined)s[k]=o[k];});
  s.equip=Object.assign(DEF().equip,s.equip);s.look=Object.assign(DEF().look,s.look);
  if(o.plan&&o.plan.days)s.cur={id:uid(),start:todayISO(),mode:o.plan.mode||"simple",days:o.plan.days.map(d=>({b:d.b?[d.b]:[],l:d.l?[d.l]:[],d:d.d?[d.d]:[],s:d.s?[d.s]:[],listed:false}))};
  return s;
}
function uid(){return Math.random().toString(36).slice(2,9);}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dateOf(iso,add){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d+add);}
function loadState(){
  /* стара тема „lav“ е вече основната */
  const raw=lsGet(KEY);
  if(raw){try{return mergeState(JSON.parse(raw));}catch(e){}}
  const old=lsGet("layka-v2");
  if(old){try{return migrate(JSON.parse(old));}catch(e){}}
  return DEF();
}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function dietOK(r){if((!S.dairy&&r.tags.includes("dairy"))||(!S.red&&r.tags.includes("red"))||(!S.fish&&r.tags.includes("fish"))||(S.gf&&r.tags.includes("gluten")))return false;for(const k of r.keys){if(S.pref[k]===-1)return false;}return true;}
function ownedMethods(r,eq){return Object.keys(r.cook).filter(m=>m==="raw"||eq[m]);}
function eligible(r){return dietOK(r)&&ownedMethods(r,S.equip).length>0;}
function likeScore(r){let n=0;for(const k of r.keys)if(S.pref[k]===1)n++;return n;}
function num(x){return x===0.5?"½":String(x).replace(".",",");}
function fmtQ(q,u){
  if(u==="г"){return q>=1000?num(Math.round(q/50)*50/1000)+" кг":(q>=100?Math.round(q/10)*10:Math.round(q/5)*5)+" г";}
  if(u==="мл"){return q>=1000?num(Math.round(q/50)*50/1000)+" л":Math.round(q/10)*10+" мл";}
  if(!q)return "";
  return num(Math.ceil(q*2-1e-9)/2)+" "+u;
}

  vars["--fs"]=String(L.fs);
  const rd={sharp:["6px","4px"],mid:["18px","12px"],round:["28px","20px"]}[L.r]||["18px","12px"];
  vars["--r"]=rd[0];vars["--r-sm"]=rd[1];

const emptyDay=()=>({b:[],l:[],d:[],s:[],listed:false});
const hasMeals=p=>p&&p.days.some(d=>SLOTS.some(([k])=>d[k].length));
function allIds(p){const o=[];if(p)p.days.forEach(d=>SLOTS.forEach(([k])=>d[k].forEach(id=>o.push(id))));return o;}
function archivePlan(){if(hasMeals(S.cur)){S.hist.unshift(JSON.parse(JSON.stringify(S.cur)));S.hist=S.hist.slice(0,10);}}
function pickL(arr){const lk=arr.filter(r=>likeScore(r)>0);return(lk.length&&Math.random()<.7)?rnd(lk):rnd(arr);}
function pickN(arr,n){const lk=shuffle(arr.filter(r=>likeScore(r)>0)),rest=shuffle(arr.filter(r=>!likeScore(r)));return lk.concat(rest).slice(0,n);}
function genPlan(days,mode){
  const el=m=>RECIPES.filter(r=>r.meal===m&&eligible(r));
  const mains=el("main"),soups=el("soup"),bfs=el("bf"),des=el("dessert");
  const plan={id:uid(),start:todayISO(),mode,days:Array.from({length:days},emptyDay)};
  if(!mains.length)return plan;
  const need=mode==="simple"?Math.ceil(days/2):days;
  const redMax=days>=7?2:1;let red=0,fat=0;const dishes=[];
  const byBase={};mains.forEach(r=>(byBase[r.base]=byBase[r.base]||[]).push(r));
  const wants=["пиле","пуйка","риба","без месо","телешко","свинско"].filter(b=>byBase[b]);
  const all=wants.length?wants:Object.keys(byBase);let order=[];
  while(dishes.length<need){
    if(!order.length)order=shuffle(all);
    const prev=dishes.length?dishes[dishes.length-1].base:null;
    let bi=order.findIndex(b=>b!==prev&&!((b==="телешко"||b==="свинско")&&red>=redMax));
    if(bi<0)bi=0;
    const b=order.splice(bi,1)[0];
    let cand=byBase[b].filter(r=>!dishes.includes(r)&&!(r.tags.includes("fatfish")&&fat>=1));
    if(!cand.length)cand=byBase[b];
    const c=pickL(cand);dishes.push(c);if(c.tags.includes("red"))red++;if(c.tags.includes("fatfish"))fat++;
  }
  const sp=pickN(soups,Math.min(days,7)),bp=pickN(bfs,Math.min(3,bfs.length)),dp=pickN(des,Math.min(3,des.length));
  for(let d=0;d<days;d++){
    const dish=dishes[mode==="simple"?Math.floor(d/2):d];
    const dinner=mode==="simple"?dish:(sp.length?sp[d%sp.length]:dish);
    const day=plan.days[d];
    if(bp.length)day.b=[bp[d%bp.length].id];
    day.l=[dish.id];day.d=[dinner.id];
    if(dp.length)day.s=[dp[d%dp.length].id];
  }
  return plan;
}
function setPlan(p){archivePlan();S.cur=p;save();}

/* ---- анализ на плана ---- */
function analyze(p){
  const out=[];if(!hasMeals(p))return [{t:"info",x:"Планът е празен. Добави ястия или поискай предложение."}];
  const mainIds=[];p.days.forEach(d=>["l","d"].forEach(k=>d[k].forEach(id=>mainIds.push(id))));
  const recs=allIds(p).map(id=>BY[id]);const mains=mainIds.map(id=>BY[id]).filter(r=>r.meal==="main");
  const nDays=p.days.length;
  const red=mains.filter(r=>r.tags.includes("red")).length;
  if(red>(nDays>=7?4:2))out.push({t:"warn",x:`Червено месо в ${red} основни хранения. Избирай постни части и го редувай с пиле, пуйка и риба.`});
  const fish=mains.filter(r=>r.tags.includes("fish")).length;
  if(nDays>=3&&S.fish&&!fish)out.push({t:"info",x:"В плана няма риба. За разнообразие добави хек или пъстърва."});
  if(mains.filter(r=>r.tags.includes("fatfish")).length>1)out.push({t:"warn",x:"Сьомга повече от един път. Тлъстата риба не е за всеки ден."});
  let run=1,maxRun=1,runBase="";
  for(let i=1;i<mains.length;i++){if(mains[i].base!=="без месо"&&mains[i].base===mains[i-1].base&&mains[i].id!==mains[i-1].id){run++;if(run>maxRun){maxRun=run;runBase=mains[i].base;}}else run=1;}
  if(maxRun>=3)out.push({t:"info",x:`${maxRun} поредни основни ястия с ${runBase}. Добави друга основа за разнообразие.`});
  const gas=recs.filter(r=>r.keys.some(k=>k==="броколи"||k==="карфиол")).length;
  if(gas>=Math.max(3,nDays))out.push({t:"info",x:`Броколи или карфиол в ${gas} хранения. Ако подуват, намали порциите.`});
  const bad=[...new Set(recs.filter(r=>!eligible(r)).map(r=>r.n))];
  if(bad.length)out.push({t:"warn",x:`Не отговарят на настройките (уреди или нежелани продукти): ${bad.slice(0,3).join("; ")}${bad.length>3?" и още "+(bad.length-3):""}.`});
  p.days.forEach((d,i)=>{const miss=SLOTS.filter(([k])=>["l","d"].includes(k)&&!d[k].length).map(([,l])=>l.toLowerCase());if(miss.length)out.push({t:"info",x:`${dayLabel(p,i)}: няма ${miss.join(" и ")}.`});});
  const items=aggregateIds(allIds(p),S.people/2);
  out.push({t:"ok",x:`За целия план ще купиш ${items.length} различни продукта.`});
  const cooks=cookSessions(p).length;
  out.push({t:"ok",x:`Готвиш ${cooks} ${cooks===1?"път":"пъти"} за обяд и вечеря.`});
  return out;
}
function cookSessions(p){
  const seq=[];p.days.forEach((d,di)=>["l","d"].forEach(k=>d[k].forEach(id=>seq.push({id,di}))));
  const out=[];let i=0;
  while(i<seq.length){let j=i;while(j+1<seq.length&&seq[j+1].id===seq[i].id)j++;out.push({di:seq[i].di,id:seq[i].id,meals:j-i+1});i=j+1;}
  return out;
}

/* ---- предложения при добавяне ---- */
function suggestions(di,k,replaceId){
  const p=S.cur,planned=allIds(p),pk=new Set();
  planned.forEach(id=>BY[id].keys.forEach(x=>{if(!STAPLE.has(x))pk.add(x);}));
  const baseSeen=new Set(planned.map(id=>BY[id].base).filter(b=>b!=="-"&&b!=="без месо"));
  const day=p.days[di],neigh=new Set([...(day.l||[]),...(day.d||[])].map(id=>BY[id].base));
  const pool=RECIPES.filter(r=>SLOT_MEALS[k].includes(r.meal)&&eligible(r)&&r.id!==replaceId);
  const scored=pool.map(r=>{
    const like=likeScore(r),shared=r.keys.filter(x=>pk.has(x)&&!STAPLE.has(x));
    const ratio=shared.length/Math.max(1,r.keys.length),newBase=r.base!=="-"&&r.base!=="без месо"&&!baseSeen.has(r.base),dup=planned.includes(r.id);
    const sameNeigh=(k==="l"||k==="d")&&r.base!=="-"&&r.base!=="без месо"&&neigh.has(r.base);
    let s=like*3+ratio*4+(newBase?2:0)-(dup?6:0)-(sameNeigh?2:0)-(r.time>60?1:0)+(r.time<=30?.5:0)+Math.random()*1.5;
    const why=[];
    if(like)why.push("♥ Любим продукт: "+r.keys.filter(x=>S.pref[x]===1).slice(0,2).join(", "));
    if(shared.length>=2)why.push("Използва вече планирани продукти: "+shared.slice(0,3).join(", "));
    if(newBase)why.push("Нова основа: "+r.base);
    if(r.time<=30)why.push("Бързо: "+r.time+" мин");
    if(dup)why.push("Вече е в плана");
    return {r,s,why};
  }).sort((a,b)=>b.s-a.s).slice(0,60);
  const seen={},res=[];
  for(const x of scored){const key=x.r.n.split(" ").slice(0,2).join(" ");seen[key]=(seen[key]||0)+1;if(seen[key]<=2)res.push(x);if(res.length>=8)break;}
  return res;
}

function recipeItems(id,f){
  const r=BY[id],out=[];
  for(const i of r.ing){if(i.opt||i.n==="вода"||STAPLE.has(i.n))continue;out.push({n:i.n,u:i.u,c:i.c,q:i.q*f});}
  return out;
}
function aggregateIds(ids,f){
  const m=new Map();
  ids.forEach(id=>recipeItems(id,f).forEach(i=>{const key=i.n+"|"+i.u;const o=m.get(key)||{n:i.n,u:i.u,c:i.c,q:0};o.q+=i.q;m.set(key,o);}));
  return [...m.values()];
}
function addToShop(items,from){
  let added=0;
  for(const it of items){
    const ex=S.shop.find(x=>!x.done&&x.n===it.n&&x.u===it.u);
    if(ex){ex.q+=it.q;}else S.shop.push({id:uid(),n:it.n,q:it.q,u:it.u,c:it.c||CATOF[it.n]||"o",done:false,from});
    added++;
  }
  save();return added;
}

      <div class="rule"><b>2</b><p><b style="font:700 1rem var(--f-body);color:var(--ink)">4–6 малки хранения</b><br><span class="muted small">Не пропускай храна.</span></p></div>
      <div class="rule"><b>3</b><p><b style="font:700 1rem var(--f-body);color:var(--ink)">Без пържено и люто</b><br><span class="muted small">Варене, пара, печене, задушаване.</span></p></div>
      <div class="rule"><b>4</b><p><b style="font:700 1rem var(--f-body);color:var(--ink)">Не лягай след хранене</b><br><span class="muted small">Изчакай 3–4 часа преди сън.</span></p></div>

plan(){

    <p class="muted" style="margin-top:6px;max-width:62ch">Приеми предложението или го промени: добавяй, махай и сменяй ястия, копирай дни и стари планове. Планът се пази на това устройство.</p></div>
    <div class="card" style="display:grid;gap:14px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <div class="seg" role="group" aria-label="Брой дни">${[[1,"Ден"],[3,"3 дни"],[7,"Седмица"]].map(([n,l])=>`<button data-act="plan-set" data-n="${n}" aria-pressed="${S.planDays==n}">${l}</button>`).join("")}</div>

list(){

  const groups=CATS.map(([k,l])=>[k,l,open.filter(i=>i.c===k).sort((a,b)=>a.n.localeCompare(b.n,"bg"))]).filter(g=>g[2].length);

  return `
  <section style="display:grid;gap:14px">
    <div><div class="eyebrow">Пазаруване</div><h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">Списък за пазаруване</h1>
    <p class="muted" style="margin-top:6px;max-width:62ch">Списъкът се пази на това устройство. Купените продукти остават отбелязани, докато не ги махнеш. Така можеш да добавяш нови продукти по всяко време, без да губиш стария списък.</p></div>
    <div class="card" style="display:grid;gap:12px">
      <div style="display:flex;gap:10px;flex-wrap:wrap">

        <button class="btn ghost" data-act="it-new">Добави продукт</button>
        <a class="btn ghost" href="#recipes">Добави от рецепта</a>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <span class="tag ok">${done.length} от ${S.shop.length} купени</span>
        ${open.length?`<button class="btn sm ghost" data-act="copy">Копирай списъка</button>`:""}
        ${done.length?`<button class="btn sm ghost" data-act="clear-done">Махни купените (${done.length})</button>`:""}
        ${S.shop.length?(CONFIRM_CLEAR?`<span class="small">Да изтрия целия списък?</span><button class="btn sm" style="background:var(--no);color:#fff" data-act="clear-all">Да, изтрий</button><button class="btn sm ghost" data-act="clear-no">Не</button>`:`<button class="btn sm ghost" data-act="clear-ask">Нов списък</button>`):""}

  ${done.length?`<section class="lgroup card"><h3>Купено<span class="muted small">${done.length}</span></h3>${done.sort((a,b)=>a.n.localeCompare(b.n,"bg")).map(row).join("")}</section>`:""}`;

prefs(){
  const L=S.look;
  const sw=(k,t,d)=>`<label class="sw"><span><b>${t}</b><br><span class="muted small">${d}</span></span><input type="checkbox" role="switch" data-act="set-diet" data-k="${k}" ${S[k]?"checked":""}></label>`;
  const segB=(p,arr)=>`<div class="seg" role="group">${arr.map(([v,l])=>`<button data-act="look" data-p="${p}" data-v="${v}" aria-pressed="${L[p]==v}">${l}</button>`).join("")}</div>`;
  const cats=[["m","Месо и риба"],["z","Зеленчуци"],["f","Плодове"],["d","Млечни и яйца"],["g","Зърнени"]];
  const nPref=Object.keys(S.pref).length;
  return `
  <section><div class="eyebrow">Настройки</div><h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">Вкус и кухня</h1>
    <p class="muted" style="margin-top:6px;max-width:62ch">Всички настройки, планове и списъци се пазят на това устройство и остават след затваряне на приложението.</p>
    ${STORE_OK?"":'<div class="tipbox" style="margin-top:10px"><b>Внимание:</b> браузърът не позволява запазване (например режим „инкогнито“). Данните ще се загубят при затваряне.</div>'}</section>
  <section class="card" style="display:grid;gap:16px"><h2>Вид</h2>
    <div class="swatches">${Object.entries(SKINS).map(([k,sk])=>`<button class="sw-opt" data-act="skin" data-k="${k}" aria-pressed="${L.skin===k}"><span class="sw-prev">${sk.sw.map(c=>`<i style="background:${c}"></i>`).join("")}</span>${sk.n}</button>`).join("")}</div>
    <div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      <div><div class="eyebrow" style="margin-bottom:6px">Размер на текста</div>${segB("fs",[[.9,"Малък"],[1,"Среден"],[1.12,"Голям"],[1.25,"Най-голям"]])}</div>
      <div><div class="eyebrow" style="margin-bottom:6px">Ъгли</div>${segB("r",[["sharp","Остри"],["mid","Меки"],["round","Овални"]])}</div>
      <div><div class="eyebrow" style="margin-bottom:6px">Заглавия</div>${segB("font",[["serif","С засечки"],["sans","Без засечки"]])}</div>
    </div>
    <p class="muted small">„Лавандула“ следва светлия или тъмния режим на устройството. Останалите теми са с фиксирани цветове.</p></section>
  <section class="card" style="display:grid;gap:14px"><h2>Кухня</h2>
    <p class="muted small">С какво готвиш? Показват се само рецепти, които могат да се сготвят с тези уреди. Котлонът е за готвене в тенджера без мазнина.</p>
    <div class="chips">${Object.entries(METHODS).filter(([k])=>k!=="raw").map(([k,l])=>`<button class="chip" data-act="set-eq" data-m="${k}" aria-pressed="${!!S.equip[k]}">${l}</button>`).join("")}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><b>Порции на хранене</b><div class="muted small">Влияе на количествата в списъка за пазаруване</div></div>
      <div class="stepper"><button data-act="set-ppl" data-d="-1" aria-label="Намали">−</button><b>${S.people}</b><button data-act="set-ppl" data-d="1" aria-label="Увеличи">+</button></div></div></section>
  <section class="card"><h2 style="margin-bottom:6px">Какво ядеш</h2>
    ${sw("dairy","Млечни продукти","Котидж, нискомаслена сметана, прясно кисело мляко")}
    ${sw("red","Червено месо","Постно телешко и свинско (бонфиле)")}
    ${sw("fish","Риба","Хек, пъстърва, сьомга")}
    ${sw("gf","Без глутен","Скрива ястията с брашно, хляб, макарони и кускус. Включи, само ако лекар го е препоръчал")}</section>
  <section class="card" style="display:grid;gap:16px"><div><h2>Любими и нежелани продукти</h2>
    <p class="muted small" style="margin-top:4px">Докосни продукт: веднъж – харесва (♥), втори път – не го яде (зачертан), трети път – без значение. Ястия с нежелан продукт не се показват и не влизат в предложенията. Любимите се предлагат по-често.</p></div>
    <div class="legend"><span class="pref like">♥ харесва</span><span class="pref no">не го яде</span><span>${nPref?nPref+" избрани":"нищо избрано"}</span>${nPref?'<button class="btn sm ghost" data-act="pref-clear">Изчисти всичко</button>':""}</div>
    ${cats.map(([c,l])=>`<div><div class="eyebrow" style="margin-bottom:8px">${l}</div><div class="chips">${(PKEYS[c]||[]).map(k=>{const st=S.pref[k];return `<button class="pref ${st===1?"like":st===-1?"no":""}" data-act="pref" data-k="${esc(k)}" aria-label="${cap(k)}: ${st===1?"харесва":st===-1?"не го яде":"без предпочитание"}">${st===1?"♥ ":""}${cap(k)}</button>`;}).join("")}</div></div>`).join("")}
    <p class="muted small">Лук, чесън, домати, чушки, лимон, пипер и пържене не присъстват в рецептите по подразбиране, защото често дразнят стомаха.</p></section>
  ${syncCard()}
  <section class="card" style="display:grid;gap:12px"><h2>Резервно копие</h2>
    <p class="muted small">Данните се пазят в браузъра на това устройство. Ако чистиш данните на браузъра или смениш телефона, ги губиш. Копирай ги като текст и ги пази в бележки или съобщение, за да ги върнеш по-късно.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-act="bk-copy">Копирай данните</button><button class="btn ghost" data-act="bk-file">Свали като файл</button></div>
    <label class="fld">Върни от копие<textarea class="search" id="bk-in" rows="3" placeholder="Постави тук копираните данни"></textarea></label>
    <div><button class="btn" data-act="bk-restore">Върни данните</button></div>
    <p class="muted small" id="bk-msg"></p></section>`;
}
};

function planBody(p,sgn){

  return `

    <ul class="an">${an.map(a=>`<li class="${a.t}"><b>${sgn[a.t]}</b><span>${a.x}</span></li>`).join("")}</ul></section>
  ${cooks.length?`<section class="card" style="display:grid;gap:10px"><h3>Кога готвиш</h3>
    <ul class="cooks">${cooks.map(c=>`<li><span class="d">${dayShort(p,c.di)}</span><span><button class="nm" data-act="open" data-id="${c.id}">${BY[c.id].n}</button> <span class="muted small">· стига за ${c.meals} ${c.meals==1?"хранене":"хранения"}</span></span></li>`).join("")}</ul></section>`:""}
  <section class="grid" style="grid-template-columns:repeat(auto-fill,minmax(310px,1fr))">
    ${p.days.map((d,di)=>`<div class="card pday"><div class="dayh"><div><h3>${dayLabel(p,di)}</h3><span class="muted small">Ден ${di+1}${d.listed?' · <span class="tag ok">в списъка</span>':""}</span></div></div>
      ${SLOTS.map(([k,l])=>`<div class="slot2"><span class="lbl">${l}</span><div class="its">${d[k].map((id,ii)=>`<div class="it"><button class="nm" data-act="open" data-id="${id}">${BY[id].n}</button><span class="ia"><button class="btn sm ghost" data-act="pick" data-d="${di}" data-k="${k}" data-i="${ii}">смени</button><button class="x-sm" data-act="slot-rm" data-d="${di}" data-k="${k}" data-i="${ii}" aria-label="Махни ${esc(BY[id].n)}">×</button></span></div>`).join("")}
        <button class="addb" data-act="pick" data-d="${di}" data-k="${k}">+ Добави</button></div></div>`).join("")}
      <div class="dayact">
        <button class="btn sm ghost" data-act="day-list" data-d="${di}">${d.listed?"Добави пак в списъка":"Добави в списъка"}</button>
        <button class="btn sm ghost" data-act="day-copy" data-d="${di}">Копирай в следващия</button>
        <button class="btn sm ghost" data-act="day-clear" data-d="${di}">Изчисти</button>
        ${p.days.length>1?`<button class="btn sm ghost" data-act="day-rm" data-d="${di}">Махни дена</button>`:""}
      </div></div>`).join("")}

  <section style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn ghost" data-act="day-add">+ Добави ден</button>

}

/* ---- Правила: три отделни раздела ---- */
function guideBody(){
  if(GT==="food"){
    const q=FQ.trim().toLowerCase();
    const sec=SECTIONS.filter(s=>FS==="all"||s.k===FS);
    const count=k=>FOOD.reduce((a,c)=>a+c[k].length,0);
    const nav=`<div class="tri">${SECTIONS.map(s=>`<button class="trib ${s.k}" data-act="fs" data-s="${s.k}" aria-pressed="${FS===s.k}"><span class="g">${s.g}</span><span><b>${s.t}</b><small>${count(s.k)} вида</small></span></button>`).join("")}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input class="search" id="fq" type="search" placeholder="Може ли… (например банан, лук, сьомга)" value="${esc(FQ)}" aria-label="Търси продукт" style="flex:1 1 260px">${FS!=="all"?'<button class="btn sm ghost" data-act="fs" data-s="all">Покажи и трите раздела</button>':""}</div>
      <div class="note"><b>Важно:</b> ${GUIDE_INTRO}</div>`;
    return nav+`<div id="fgrid" style="display:grid;gap:18px">${foodSections(sec,q)}</div>`;
  }
  if(GT==="habits")return `<div class="grid">${HABITS.map((h,i)=>`<div class="card"><div class="eyebrow">${i+1}</div><h3>${h[0]}</h3><p class="muted" style="margin-top:6px">${h[1]}</p></div>`).join("")}</div>
    <div class="alarm"><h3>Кога да потърсиш лекар веднага</h3><ul>${ALARM.map(a=>`<li>${a}</li>`).join("")}</ul></div>`;
  if(GT==="tricks")return `<div class="grid">${TRICKS.map(h=>`<div class="card"><h3>${h[0]}</h3><p class="muted" style="margin-top:6px">${h[1]}</p></div>`).join("")}</div>`;
  if(GT==="subs")return `<div class="card scroll-x"><table class="sub"><thead><tr><th>Махни</th><th>Замести с</th></tr></thead><tbody>${SUBS.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td></tr>`).join("")}</tbody></table></div>
    <div class="tipbox"><b>Вкус без дразнене:</b> магданоз, копър, босилек и мащерка. Зехтинът или маслото се добавят, след като храната е сготвена.</div>`;
  return `<div class="card" style="display:grid;gap:10px"><h3>Как е съставено менюто</h3>
    <p>Рецептите са щадящи по подразбиране: без пържене, без люти подправки, лук, чесън, домати, лимон и други кисели или дразнещи продукти. Така менюто е подходящо за повечето хора с гастрит.</p>
    <p>Реакцията към храните е различна при всеки човек. Затова в настройките можеш да отбелязваш любими и нежелани продукти и да избираш уреди.</p>
    <p>Научните данни за конкретна диета при гастрит са ограничени. Общите съвети за по-малко кофеин, без алкохол и тютюн, без много кисела, люта и мазна храна и пауза преди сън са в съответствие с насоките на здравните служби.</p></div>

function quickResults(){
  const sel=new Set();Q.picks.forEach(i=>GROUPS[i].k.forEach(k=>sel.add(k)));
  const selProt=[...Q.picks].some(i=>GROUPS[i].p);
  const run=cap=>{
    const out=[];
    for(const r of RECIPES){
      if(!dietOK(r))continue;
      if(Q.meal!=="any"&&r.meal!==Q.meal)continue;
      const ms=ownedMethods(r,Q.equip);if(!ms.length)continue;
      if(r.time>Q.time)continue;
      if(selProt&&r.prot.some(p=>!sel.has(p)))continue;
      const main=[...new Set(r.ing.filter(i=>!i.opt&&!STAPLE.has(i.n)&&i.c!=="o").map(i=>i.n))];
      if(main.length>cap)continue;
      const miss=main.filter(n=>!sel.has(n));
      if(Q.picks.size&&main.length&&main.every(n=>!sel.has(n)))continue;
      const have=main.length-miss.length;
      out.push({r,m:ms[0],miss,s:miss.length*100+main.length*6-have*30+r.time/10-likeScore(r)*20+Math.random()*8});
    }
    const seen={},res=[];for(const x of out.sort((a,b)=>a.s-b.s)){const k=x.r.n.split(" ").slice(0,2).join(" ");seen[k]=(seen[k]||0)+1;if(seen[k]<=2)res.push(x);if(res.length>=8)break;}
    return res;
  };
  const auto=Q.maxIng==null;
  const cap=auto?(Q.picks.size>0&&Q.picks.size<=2?3:99):Q.maxIng;
  let list=run(cap),relaxed=false,used=cap;
  if(!list.length&&cap<99){list=run(99);relaxed=list.length>0;used=99;}
  return {list,cap:used,relaxed};
}
/* ============ ОБЩО ТЪРСЕНЕ ============ */
let SQ={q:"",all:false,tab:"all",lim:24};
const NORM=s=>String(s).toLowerCase();
function stem(t){t=NORM(t);for(const e of ["ите","ата","ето","ове","ият","ия"]){if(t.length>=e.length+3&&t.endsWith(e))return t.slice(0,-e.length);}return t.length>=5?t.slice(0,-1):t;}
function hit(tx,t){if(t.length>3)return tx.includes(t);const safe=t.replace(/[^а-яa-z0-9]/g,"");return new RegExp("(^|[^а-яa-z0-9])"+safe+"[а-я]{0,2}($|[^а-яa-z0-9])").test(tx);}
function qTerms(q){return NORM(q).split(/[\s,;+]+/).filter(Boolean).map(stem);}
function rtext(r){return r._t||(r._t=NORM([r.n,MEALS[r.meal],r.base,...r.keys,...Object.keys(r.cook).map(m=>METHODS[m]),r.tags.includes("dairy")?"млечни":"",r.tags.includes("red")?"червено месо":""].join(" ")));}
function searchAll(q){
  const T=qTerms(q);if(!T.length)return null;
  const rec=[];let hidden=0;
  for(const r of RECIPES){
    const tx=rtext(r);let n=0;for(const t of T)if(hit(tx,t))n++;
    if(!n)continue;
    if(!SQ.all&&!dietOK(r)){hidden++;continue;}
    rec.push({r,n});
  }
  const full=rec.filter(x=>x.n===T.length).sort((a,b)=>likeScore(b.r)-likeScore(a.r)||a.r.time-b.r.time);
  const part=rec.filter(x=>x.n<T.length).sort((a,b)=>b.n-a.n||likeScore(b.r)-likeScore(a.r)||a.r.time-b.r.time);
  const foods=[];
  SECTIONS.forEach(s=>FOOD.forEach(c=>c[s.k].forEach(it=>{const tx=NORM(it+" "+c.c);const n=T.filter(t=>hit(tx,t)).length;if(n)foods.push({s,c:c.c,it,n});})));
  foods.sort((a,b)=>b.n-a.n);
  const tips=[];
  const addT=(k,t,d)=>{const tx=NORM(t+" "+d);const n=T.filter(x=>hit(tx,x)).length;if(n)tips.push({k,t,d,n});};
  HABITS.forEach(h=>addT("Навик",h[0],h[1]));
  TRICKS.forEach(h=>addT("Трик",h[0],h[1]));
  SUBS.forEach(h=>addT("Замяна",h[0],h[1]));
  ALARM.forEach(a=>addT("Алармен симптом",a,"Потърси лекар."));
  tips.sort((a,b)=>b.n-a.n);
  const shop=S.shop.filter(i=>T.some(t=>hit(NORM(i.n),t)));
  return {T,full,part,hidden,foods,tips,shop};
}

/* ============ ОБЩО ПРОСТРАНСТВО (синхронизация с код) ============
   Споделят се: план, списък за пазаруване, любими, нежелани/любими продукти и режим на храна/уреди.
   Не се споделя: външният вид (тема, размер на текста).
   Сървърът пази по един документ за всеки код. Сливането е по ключ: печели по-новата промяна. */
const CODE_RE=/^[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}$/;
const SYNC_KEY="pissi-sync";
const freshTs=()=>({plan:0,set:0,shop:{},fav:{},pref:{}});
let SY=(function(){try{const x=JSON.parse(lsGet(SYNC_KEY)||"null");if(x&&x.code)return Object.assign({code:"",init:"",base:null,last:0,status:"",ts:freshTs()},x,{ts:Object.assign(freshTs(),x.ts||{})});}catch(e){}return {code:"",init:"",base:null,last:0,status:"",ts:freshTs()};})();
function saveSY(){lsSet(SYNC_KEY,JSON.stringify(SY));}
function sharedView(){
  return {plan:{cur:S.cur,hist:S.hist},
    set:{equip:S.equip,people:S.people,dairy:S.dairy,red:S.red,fish:S.fish,gf:S.gf},
    shop:Object.fromEntries(S.shop.map(i=>[i.id,i])),fav:S.fav,pref:S.pref};
}
/* открива какво е променено локално, като сравнява с последното синхронизирано състояние */
function detectLocal(){
  const cur=sharedView(),b=SY.base,now=Date.now(),jp=JSON.stringify;
  if(!b){
    if(SY.init==="create"){SY.ts.plan=SY.ts.plan||now;SY.ts.set=SY.ts.set||now;}
    for(const sec of ["shop","fav","pref"])for(const k of Object.keys(cur[sec]))if(!SY.ts[sec][k])SY.ts[sec][k]=now;
    return;
  }
  if(jp(cur.plan)!==jp(b.plan))SY.ts.plan=now;
  if(jp(cur.set)!==jp(b.set))SY.ts.set=now;
  for(const sec of ["shop","fav","pref"]){
    const a=cur[sec],o=b[sec]||{},t=SY.ts[sec];
    for(const k of Object.keys(a))if(jp(a[k])!==jp(o[k]))t[k]=now;
    for(const k of Object.keys(o))if(!(k in a))t[k]=now;
  }
}
function buildPayload(){
  const cur=sharedView(),P={plan:{ts:SY.ts.plan,data:cur.plan},set:{ts:SY.ts.set,data:cur.set},shop:{},fav:{},pref:{}};
  for(const sec of ["shop","fav","pref"]){
    const a=cur[sec],t=SY.ts[sec];
    for(const k of new Set([...Object.keys(a),...Object.keys(t)]))P[sec][k]={ts:t[k]||0,d:k in a?a[k]:null};
  }
  return P;
}
/* връща true, ако локалните данни са се променили */
function applyServer(doc){
  let changed=false;
  if(doc.plan&&doc.plan.ts>SY.ts.plan){S.cur=doc.plan.data.cur;S.hist=doc.plan.data.hist||[];SY.ts.plan=doc.plan.ts;changed=true;}
  if(doc.set&&doc.set.ts>SY.ts.set){const d=doc.set.data;S.equip=Object.assign({},S.equip,d.equip);["people","dairy","red","fish","gf"].forEach(k=>{if(d[k]!==undefined)S[k]=d[k];});SY.ts.set=doc.set.ts;changed=true;}
  const shop=new Map(S.shop.map(i=>[i.id,i]));
  for(const [k,v] of Object.entries(doc.shop||{})){
    if(v.ts>(SY.ts.shop[k]||0)){
      if(v.d===null){if(shop.delete(k))changed=true;}else{shop.set(k,v.d);changed=true;}
      SY.ts.shop[k]=v.ts;
    }
  }
  S.shop=[...shop.values()];
  for(const sec of ["fav","pref"]){
    for(const [k,v] of Object.entries(doc[sec]||{})){
      if(v.ts>(SY.ts[sec][k]||0)){
        if(v.d===null||v.d===0){if(k in S[sec]){delete S[sec][k];changed=true;}}else if(S[sec][k]!==v.d){S[sec][k]=v.d;changed=true;}
        SY.ts[sec][k]=v.ts;
      }
    }
  }
  return changed;
}
let syncing=false,syncAgain=false,syncTimer=null;
function scheduleSync(){if(!SY.code)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1200);}
async function syncNow(){
  if(!SY.code)return;
  if(syncing){syncAgain=true;return;}
  syncing=true;
  try{
    detectLocal();
    const res=await fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:SY.code,data:buildPayload()})});
    if(!res.ok)throw new Error("http "+res.status);
    const doc=await res.json();
    detectLocal();                       /* промени, направени по време на заявката */
    const changed=applyServer(doc);
    SY.base=JSON.parse(JSON.stringify(sharedView()));SY.last=Date.now();SY.status="ok";
    persist();saveSY();
    if(changed&&!dlg.open&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render();
  }catch(e){SY.status="error";saveSY();}
  finally{
    syncing=false;
    document.querySelectorAll(".sy-status").forEach(b=>{b.innerHTML=syncStatusHTML();});
    if(syncAgain){syncAgain=false;scheduleSync();}
  }
}
function syncStatusHTML(){
  if(!SY.code)return "";
  const t=SY.last?new Date(SY.last).toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"}):"";
  return SY.status==="error"?'<span class="tag lim">Няма връзка. Ще опитаме пак.</span>':(t?`<span class="tag ok">Синхронизирано в ${t}</span>`:'<span class="tag">Синхронизиране…</span>');
}
function genCode(){
  const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",b=new Uint8Array(12);crypto.getRandomValues(b);
  const c=[...b].map(x=>A[x%A.length]).join("");return c.slice(0,4)+"-"+c.slice(4,8)+"-"+c.slice(8,12);
}
function normCode(s){
  const c=String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
  return c.length===12?c.slice(0,4)+"-"+c.slice(4,8)+"-"+c.slice(8,12):String(s).toUpperCase().trim();
}
async function syncCheck(code){
  const res=await fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,check:true})});
  if(!res.ok)throw new Error("http "+res.status);
  return (await res.json()).exists;
}

    case "skin":S.look.skin=d.k;save();applyLook();render();break;
    case "look":S.look[d.p]=d.p==="fs"?+d.v:d.v;save();applyLook();render();break;
    case "pref":{const v=S.pref[d.k];if(v===1)S.pref[d.k]=-1;else if(v===-1)delete S.pref[d.k];else S.pref[d.k]=1;HOME_IDEA=null;save();render();break;}
    case "pref-clear":S.pref={};HOME_IDEA=null;save();render();break;
    case "bk-copy":{const txt=JSON.stringify(S);const done=()=>{$("#bk-msg").textContent="Данните са копирани. Постави ги на сигурно място.";};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>{$("#bk-in").value=txt;$("#bk-in").select();$("#bk-msg").textContent="Маркирай текста и го копирай ръчно.";});else{$("#bk-in").value=txt;$("#bk-in").select();$("#bk-msg").textContent="Маркирай текста и го копирай ръчно.";}break;}
    case "bk-file":{try{const b=new Blob([JSON.stringify(S)],{type:"application/json"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download="pissi-kopie.json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}catch(_){$("#bk-msg").textContent="Свалянето не е възможно тук. Използвай „Копирай данните“.";}break;}
    case "bk-restore":{try{const x=JSON.parse($("#bk-in").value);if(!x||typeof x!=="object"||x.v!==3)throw 0;S=mergeState(x);save();applyLook();render();toast("Данните са върнати");}catch(_){$("#bk-msg").textContent="Текстът не е валидно копие.";}break;}
  }
});
document.addEventListener("change",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act;
  if(a==="chk"){const it=S.shop.find(x=>x.id===t.dataset.id);if(it){it.done=t.checked;save();render();}}
  if(a==="set-diet"){S[t.dataset.k]=t.checked?1:0;HOME_IDEA=null;save();}
  if(a==="pld"){const i=+t.dataset.i;t.checked?PLD.add(i):PLD.delete(i);renderPlanToList();}
  if(e.target.id==="pstart"&&e.target.value){S.cur.start=e.target.value;save();render();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="sy-code"){e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/(.{4})(?=.)/g,"$1-").slice(0,14);}
  if(e.target.id==="sq"){SQ.q=e.target.value;SQ.lim=24;runSearch();}
  if(e.target.id==="rq"){RF.q=e.target.value;RLIM=48;recipeGrid();}
  if(e.target.id==="pkq"){PKR.q=e.target.value;$("#pkres").innerHTML=pickerResults();}
  if(e.target.id==="fq"){FQ=e.target.value;$("#fgrid").innerHTML=foodSections(SECTIONS.filter(s=>FS==="all"||s.k===FS),FQ.trim().toLowerCase());}
});
dlg.addEventListener("close",()=>{render();});
document.addEventListener("submit",e=>{if(e.target.id==="hsearch"){e.preventDefault();SQ.q=$("#hq").value;SQ.tab="all";location.hash="#search";}});

(function(){let last=window.scrollY||0;window.addEventListener("scroll",()=>{const y=window.scrollY||0,f=$(".fab");if(!f)return;if(y>last+6&&y>100)f.classList.add("hide");else if(y<last-6||y<100)f.classList.remove("hide");last=y;},{passive:true});})();
applyLook();
if(!S.cur||!S.cur.days)S.cur=genPlan(S.planDays,S.mode);
save();
render();
if(SY.code)syncNow();

</script>

</body>
</html>
