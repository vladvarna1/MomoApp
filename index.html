<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Меню и рецепти при хроничен гастрит">
<title>Лайка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: мобилно приложение с долна навигация; на широк екран – централна колона до 1040px.
   Палитра: бор (мастило), градинска лайка (акцент), мъхесто зелено (основен бутон), порцелан (фон). */
:root{
  --bg:#F5F8F2; --surface:#FFFFFF; --ink:#1B3832; --muted:#587068; --line:#DCE6DD;
  --brand:#2D6A58; --on-brand:#FFFFFF; --soft:#E5F0E7; --chamomile:#EBBD3F; --on-chamomile:#3B2E00;
  --ok:#2E7D5B; --ok-bg:#DDF0E4; --lim:#9A6A10; --lim-bg:#FBEFCB; --no:#B04438; --no-bg:#F8DEDA;
  --shadow:0 1px 2px rgba(27,56,50,.06),0 6px 20px rgba(27,56,50,.07);
  --f-display:"Alegreya",Georgia,"Times New Roman",serif; --r:18px; --r-sm:12px; --fs:1;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1B18; --surface:#16251F; --ink:#E5F0EA; --muted:#9BB3A9; --line:#27392F;
  --brand:#74C6A8; --on-brand:#0C1D17; --soft:#1C2E27; --chamomile:#EBC253; --on-chamomile:#2E2300;
  --ok:#78D0A3; --ok-bg:#1B3528; --lim:#E5B94F; --lim-bg:#3A3015; --no:#EE8D82; --no-bg:#40201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1B18; --surface:#16251F; --ink:#E5F0EA; --muted:#9BB3A9; --line:#27392F;
  --brand:#74C6A8; --on-brand:#0C1D17; --soft:#1C2E27; --chamomile:#EBC253; --on-chamomile:#2E2300;
  --ok:#78D0A3; --ok-bg:#1B3528; --lim:#E5B94F; --lim-bg:#3A3015; --no:#EE8D82; --no-bg:#40201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
html{font-size:calc(16px*var(--fs))}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800}
h2{font-size:1.55rem}
h3{font-size:1.2rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--chamomile);outline-offset:2px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.top .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font:800 1.35rem/1 var(--f-display);display:block}
.brand span{font-size:.72rem;color:var(--muted);display:block}
.chip-set{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px 6px 6px;font-size:.84rem;font-weight:600}
.chip-set i{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--brand)}
.chip-set i svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip-set small{display:block;font-weight:500;color:var(--muted);font-size:.7rem;line-height:1.1}
nav.tabs{display:none}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:600;border-radius:12px}
nav.bottom a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bottom a[aria-current="page"]{color:var(--brand);background:var(--soft)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:19;
  background:var(--chamomile);color:var(--on-chamomile);border:0;border-radius:99px;padding:13px 18px;font-weight:800;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{padding-top:22px;display:flex;flex-direction:column;gap:30px}
section{min-width:0}

/* buttons & chips */
.btn{border:0;background:var(--brand);color:var(--on-brand);border-radius:var(--r-sm);padding:12px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn.big{padding:17px 26px;font-size:1.12rem;border-radius:var(--r)}
.btn.cham{background:var(--chamomile);color:var(--on-chamomile)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"],.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--brand)}
.tag.lim{background:var(--lim-bg);color:var(--lim)} .tag.no{background:var(--no-bg);color:var(--no)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.seg{display:inline-flex;background:var(--soft);border-radius:var(--r-sm);padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 16px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}

/* hero */
.hero{display:grid;gap:18px;padding:26px 22px;border-radius:calc(var(--r)*1.5);background:var(--soft);position:relative;overflow:hidden}
.hero p.lead{max-width:46ch;color:var(--muted);font-size:1.05rem}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero .daisy{position:absolute;right:-38px;top:-38px;width:190px;height:190px;opacity:.9}
.rules{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.rule{display:flex;gap:12px;align-items:flex-start}
.rule b{font:800 1.6rem/1 var(--f-display);color:var(--brand);min-width:1.4em}

/* recipe cards */
.rcard{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,box-shadow .15s}
.rcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rcard h3{font-size:1.18rem}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.dot{width:4px;height:4px;border-radius:50%;background:var(--muted);display:inline-block}
.mchip{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.mchip.have{border-color:var(--brand);color:var(--brand)}
.filters{display:grid;gap:12px}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:12px 16px;font:inherit}

/* dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(640px,100%);max-height:92dvh;border-radius:calc(var(--r)*1.4) calc(var(--r)*1.4) 0 0;margin:auto auto 0;box-shadow:0 -10px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,25,20,.55)}
@media(min-width:700px){dialog{margin:auto;border-radius:24px;max-height:88dvh}}
.dlg-in{padding:22px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;overflow:auto;max-height:inherit}
.dlg-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.x{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;flex:none;font-size:1.2rem;line-height:1}
.dots{display:flex;gap:6px}.dots i{height:5px;flex:1;border-radius:9px;background:var(--line)}.dots i.on{background:var(--brand)}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--soft)}
.opt small{display:block;font-weight:500;color:var(--muted)}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ings li b{font-variant-numeric:tabular-nums;white-space:nowrap}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:flex;gap:12px}
ol.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--brand);font-weight:800;font-size:.85rem;display:grid;place-items:center;margin-top:1px}
.tipbox{background:var(--lim-bg);color:var(--ink);border-radius:var(--r-sm);padding:12px 14px;font-size:.92rem}
.tipbox b{color:var(--lim)}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:800}

/* planner */
.pday{display:grid;gap:8px}
.pday h3{display:flex;justify-content:space-between;align-items:baseline}
.slot{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.slot .lbl{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slot .nm{background:none;border:0;padding:0;text-align:left;font-weight:700;color:var(--ink);min-width:0}
.slot .nm:hover{color:var(--brand);text-decoration:underline}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--soft);border-radius:var(--r);padding:12px 16px;min-width:120px}
.stat b{display:block;font:800 1.8rem/1 var(--f-display);color:var(--brand)}
.stat span{font-size:.8rem;color:var(--muted)}
.cooks{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.cooks li{display:flex;gap:2px 12px;align-items:baseline;flex-wrap:wrap}
.cooks .d{font-weight:800;color:var(--brand);min-width:7.2em}
.cooks li>span:last-child{flex:1 1 200px;min-width:0}

/* list */
.lgroup h3{margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
.lrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lrow input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.lrow span.q{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow.done span:not(.q){text-decoration:line-through;color:var(--muted)} .lrow.done .q{color:var(--muted);text-decoration:line-through}

/* guide */
.fcat{display:grid;gap:10px}
.fl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fl .lb{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;min-width:84px}
.fi{font-size:.86rem;font-weight:600;padding:3px 10px;border-radius:99px}
.fi.ok{background:var(--ok-bg);color:var(--ok)} .fi.lim{background:var(--lim-bg);color:var(--lim)} .fi.no{background:var(--no-bg);color:var(--no)}
.fi small{font-weight:500;opacity:.85}
table.sub{width:100%;border-collapse:collapse;font-size:.92rem}
table.sub th,table.sub td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.sub th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;font-size:.9rem}
.sw{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sw input{width:46px;height:26px;accent-color:var(--brand);flex:none}
.disc{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:10px}


.micon{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex:none}
.micon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rhead{display:flex;gap:12px;align-items:center;justify-content:space-between}
.heart{border:0;background:transparent;font-size:1.35rem;line-height:1;padding:4px 6px;color:var(--muted);border-radius:50%}
.heart[aria-pressed="true"]{color:var(--no)}
.rwrap{position:relative}.rwrap .heart{position:absolute;top:10px;right:10px}
.more{display:flex;justify-content:center;padding:18px 0}
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.swatches{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.sw-opt{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px;display:grid;gap:8px;text-align:left;font-weight:700}
.sw-opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.sw-prev{height:44px;border-radius:calc(var(--r-sm));display:flex;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.sw-prev i{flex:1}
.pref{font-size:.9rem;font-weight:600;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;display:inline-flex;gap:6px;align-items:center}
.pref.like{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pref.no{background:var(--no-bg);border-color:var(--no);color:var(--no);text-decoration:line-through}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.sticky-note{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5}
@media(min-width:820px){
  body{padding-block:0 60px}
  nav.bottom{display:none}
  nav.tabs{display:flex;gap:4px}
  nav.tabs a{padding:8px 14px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem}
  nav.tabs a[aria-current="page"]{background:var(--soft);color:var(--brand)}
  .fab{bottom:28px}
  .toast{bottom:90px}
  .hero{padding:44px 40px}
  .brand{margin-right:12px}
  .top .wrap .spacer{flex:1}
}
@media(max-width:819px){.chip-set span.t{display:none}.chip-set{padding:4px}.brand span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="Начало">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
        <g fill="#fff" stroke="#C9D8CC" stroke-width=".8">
          <ellipse cx="20" cy="9" rx="3.6" ry="7.5"/><ellipse cx="20" cy="9" rx="3.6" ry="7.5" transform="rotate(45 20 20)"/>
          <ellipse cx="20" cy="9" rx="3.6" ry="7.5" transform="rotate(90 20 20)"/><ellipse cx="20" cy="9" rx="3.6" ry="7.5" transform="rotate(135 20 20)"/>
          <ellipse cx="20" cy="9" rx="3.6" ry="7.5" transform="rotate(180 20 20)"/><ellipse cx="20" cy="9" rx="3.6" ry="7.5" transform="rotate(225 20 20)"/>
          <ellipse cx="20" cy="9" rx="3.6" ry="7.5" transform="rotate(270 20 20)"/><ellipse cx="20" cy="9" rx="3.6" ry="7.5" transform="rotate(315 20 20)"/>
        </g><circle cx="20" cy="20" r="5.2" fill="#EBBD3F"/></svg>
      <div><b>Лайка</b><span>меню при гастрит</span></div>
    </a>
    <nav class="tabs" aria-label="Основна навигация">
      <a href="#home">Начало</a><a href="#recipes">Рецепти</a><a href="#plan">Планер</a><a href="#list">Пазаруване</a><a href="#guide">Правила и съвети</a>
    </nav>
    <button class="chip-set" data-act="settings" aria-label="Настройки">
      <i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></i><span class="t">Настройки<small>Хроничен гастрит</small></span>
    </button>
  </div>
</header>

<div class="wrap">
  <main id="view"></main>
</div>

<button class="fab" data-act="quick" aria-label="Бърза рецепта">
  <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Бърза рецепта
</button>

<nav class="bottom" aria-label="Навигация">
  <a href="#home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 10v10h14V10"/></svg>Начало</a>
  <a href="#recipes"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg>Рецепти</a>
  <a href="#plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Планер</a>
  <a href="#list"><svg viewBox="0 0 24 24"><path d="M5 9h14l-1.5 10h-11zM9 9l3-5 3 5"/></svg>Пазаруване</a>
  <a href="#guide"><svg viewBox="0 0 24 24"><path d="M12 21c-5-3-7-7-7-12 4 0 7 2 7 5 0-3 3-5 7-5 0 5-2 9-7 12z"/></svg>Правила</a>
</nav>

<dialog id="dlg" aria-label="Диалог"></dialog>

<script>

function fmtQ(q,u){
  if(u==="г"){return q>=1000?num(Math.round(q/50)*50/1000)+" кг":(q>=100?Math.round(q/10)*10:Math.round(q/5)*5)+" г";}

}

function quickResults(){
  const sel=new Set();Q.picks.forEach(i=>GROUPS[i].k.forEach(k=>sel.add(k)));
  const selProt=[...Q.picks].some(i=>GROUPS[i].p);
  const out=[];
  for(const r of RECIPES){
    if(!dietOK(r))continue;
    if(Q.meal!=="any"&&r.meal!==Q.meal)continue;
    const ms=ownedMethods(r,Q.equip);if(!ms.length)continue;
    if(r.time>Q.time)continue;
    if(selProt&&r.prot.some(p=>!sel.has(p)))continue;
    const main=r.ing.filter(i=>!i.opt&&!STAPLE.has(i.n)&&i.c!=="o");
    const miss=[...new Set(main.filter(i=>!sel.has(i.n)).map(i=>i.n))];
    if(Q.picks.size&&main.length&&main.every(i=>!sel.has(i.n)))continue;
    const have=main.length-main.filter(i=>!sel.has(i.n)).length;
    out.push({r,m:ms[0],miss,s:miss.length*100-have*30+r.time/10-likeScore(r)*20+Math.random()*8});
  }
  {const seen={},res=[];for(const x of out.sort((a,b)=>a.s-b.s)){const k=x.r.n.split(" ").slice(0,2).join(" ");seen[k]=(seen[k]||0)+1;if(seen[k]<=2)res.push(x);if(res.length>=8)break;}return res;}
}

/* ============ ПЛАНЕР ============ */
function likeScore(r){let n=0;for(const k of r.keys)if(S.pref[k]===1)n++;return n;}
function pickL(arr){const lk=arr.filter(r=>likeScore(r)>0);return(lk.length&&Math.random()<.7)?rnd(lk):rnd(arr);}
function pickN(arr,n){const lk=shuffle(arr.filter(r=>likeScore(r)>0)),rest=shuffle(arr.filter(r=>!likeScore(r)));return lk.concat(rest).slice(0,n);}
function genPlan(days,mode){
  const el=m=>RECIPES.filter(r=>r.meal===m&&eligible(r));
  const mains=el("main"),soups=el("soup"),bfs=el("bf"),des=el("dessert");
  if(!mains.length)return {days:[],n:days,mode};
  const need=mode==="simple"?Math.ceil(days/2):days;
  const redMax=days>=7?2:1;let red=0,fat=0;const dishes=[];
  const byBase={};mains.forEach(r=>(byBase[r.base]=byBase[r.base]||[]).push(r));
  const wants=["пиле","пуйка","риба","без месо","телешко","свинско"].filter(b=>byBase[b]);
  const all=wants.length?wants:Object.keys(byBase);let order=[];
  while(dishes.length<need){
    if(!order.length)order=shuffle(all);
    const prev=dishes.length?dishes[dishes.length-1].base:null;
    let bi=order.findIndex(b=>b!==prev&&!((b==="телешко"||b==="свинско")&&red>=redMax));
    if(bi<0)bi=0;
    const b=order.splice(bi,1)[0];
    let cand=byBase[b].filter(r=>!dishes.includes(r)&&!(r.tags.includes("fatfish")&&fat>=1));
    if(!cand.length)cand=byBase[b];
    const c=pickL(cand);dishes.push(c);if(c.tags.includes("red"))red++;if(c.tags.includes("fatfish"))fat++;
  }
  const sp=pickN(soups,Math.min(days,7)),bp=pickN(bfs,Math.min(3,bfs.length)),dp=pickN(des,Math.min(3,des.length));
  const pl=[];
  for(let d=0;d<days;d++){
    const dish=dishes[mode==="simple"?Math.floor(d/2):d];
    const dinner=mode==="simple"?dish:(sp.length?sp[d%sp.length]:dish);
    pl.push({b:bp.length?bp[d%bp.length].id:null,l:dish.id,d:dinner.id,s:dp.length?dp[d%dp.length].id:null});
  }
  return {days:pl,n:days,mode};
}
function planBody(p){
  const seq=[];p.days.forEach(d=>{seq.push(d.l,d.d);});
  const cooks=[];let i=0;
  while(i<seq.length){let j=i;while(j+1<seq.length&&seq[j+1]===seq[i])j++;cooks.push({day:Math.floor(i/2),id:seq[i],meals:j-i+1});i=j+1;}
  const uniq=new Set(seq).size;
  return `
  <section class="stats">
    <div class="stat"><b>${cooks.length}</b><span>готвения общо</span></div>
    <div class="stat"><b>${uniq}</b><span>различни ястия</span></div>
    <div class="stat"><b>${p.days.length}</b><span>${p.days.length==1?"ден":"дни"}</span></div>
  </section>
  <section class="card" style="display:grid;gap:10px"><h3>Кога готвиш</h3>
    <ul class="cooks">${cooks.map(c=>`<li><span class="d">${dayName(c.day)}</span><span><button class="slot-name" data-act="open" data-id="${c.id}" style="background:none;border:0;padding:0;font-weight:700;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line)">${BY[c.id].n}</button> <span class="muted small">· стига за ${c.meals} ${c.meals==1?"хранене":"хранения"}</span></span></li>`).join("")}</ul></section>
  <section class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
    ${p.days.map((d,di)=>`<div class="card pday"><h3>${dayName(di)}<span class="muted small" style="font-family:var(--f-body)">Ден ${di+1}</span></h3>
      ${[["b","Закуска"],["l","Обяд"],["d","Вечеря"],["s","Лека закуска"]].map(([k,l])=>d[k]?`<div class="slot"><span class="lbl">${l}</span><button class="nm" data-act="open" data-id="${d[k]}">${BY[d[k]].n}</button><button class="btn sm ghost" data-act="swap" data-d="${di}" data-k="${k}" aria-label="Смени ${l}">смени</button></div>`:"").join("")}
    </div>`).join("")}
  </section>
  <section style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn big" href="#list">Списък за пазаруване</a></section>
  <p class="muted small">Между храненията: 1–2 лесни закуски с печен плод, каша или котидж. Червеното месо е ограничено до ${p.n>=7?"2":"1"} ястие${p.n>=7?"я":""}.</p>`;
}
function swapMeal(di,k){
  const cur=S.plan.days[di][k];
  const pools={b:["bf"],l:["main"],d:S.plan.mode==="simple"?["main"]:["soup","main"],s:["dessert"]}[k];
  let c=RECIPES.filter(r=>pools.includes(r.meal)&&eligible(r)&&r.id!==cur);
  if(k==="l"||k==="d"){const used=S.plan.days.map(d=>d.l).concat(S.plan.days.map(d=>d.d));const f=c.filter(r=>!used.includes(r.id));if(f.length)c=f;}
  if(!c.length){toast("Няма друга подходяща рецепта");return;}
  S.plan.days[di][k]=rnd(c).id;save();render();
}

/* ============ СПИСЪК ============ */
function mealInstances(){
  const out=[];
  if(S.plan)S.plan.days.forEach(d=>["b","l","d","s"].forEach(k=>{if(d[k])out.push({id:d[k],f:S.people/2});}));
  S.extra.forEach(x=>out.push({id:x.id,f:x.p/2}));
  return out;
}
function aggregate(){
  const m=new Map();
  for(const it of mealInstances()){
    const r=BY[it.id];if(!r)continue;
    for(const i of r.ing){
      if(i.opt||i.n==="вода")continue;
      const c=STAPLE.has(i.n)?"s":i.c;
      const key=i.n+"|"+i.u;const o=m.get(key)||{n:i.n,u:i.u,c,q:0};o.q+=i.q*it.f;m.set(key,o);
    }
  }
  return [...m.values()];
}
function listText(){
  const items=aggregate();
  return "Списък за пазаруване\n"+CATS.map(([k,l])=>{const a=items.filter(i=>i.c===k).sort((x,y)=>x.n.localeCompare(y.n,"bg"));return a.length?"\n"+l+"\n"+a.map(i=>"• "+cap(i.n)+" – "+fmtQ(i.q,i.u)).join("\n"):"";}).join("");
}

/* ============ РУТЕР И СЪБИТИЯ ============ */
const ROUTES=["home","recipes","plan","list","guide","prefs"];
function route(){const h=location.hash.slice(1);return ROUTES.includes(h)?h:"home";}
function render(){
  const r=route();
  $("#view").innerHTML=views[r]();
  document.querySelectorAll("nav a").forEach(a=>{if(a.getAttribute("href")==="#"+r)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  if(r==="recipes"){recipeFilters();recipeGrid();}
  document.title="Лайка";
}
window.addEventListener("hashchange",()=>{if(DIRTY&&route()!=="prefs"){S.plan=genPlan(S.planDays,S.mode);DIRTY=false;HOME_IDEA=null;save();}render();window.scrollTo(0,0);});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,d=t.dataset;
  switch(a){
    case "close":closeDlg();break;
    case "quick":openQuick();break;
    case "settings":location.hash="#prefs";break;
    case "skin":S.look.skin=d.k;save();applyLook();render();break;
    case "look":S.look[d.p]=d.p==="fs"?+d.v:d.v;save();applyLook();render();break;
    case "pref":{const v=S.pref[d.k];if(v===1)S.pref[d.k]=-1;else if(v===-1)delete S.pref[d.k];else S.pref[d.k]=1;DIRTY=true;save();render();break;}
    case "pref-clear":S.pref={};DIRTY=true;save();render();break;
    case "fav":{if(S.fav[d.id])delete S.fav[d.id];else S.fav[d.id]=1;save();if(t.closest("dialog"))renderRecipe();else{t.setAttribute("aria-pressed",!!S.fav[d.id]);t.textContent=S.fav[d.id]?"♥":"♡";}break;}
    case "more":RLIM+=48;recipeGrid();break;
    case "open":openRecipe(d.id);break;
    case "open-q":openRecipe(d.id,d.m);break;
    case "idea":HOME_IDEA=null;render();break;
    case "browse":RF.meal=d.meal;RF.base="all";RF.q="";location.hash="#recipes";if(route()==="recipes")render();break;
    case "plan-days":S.planDays=+d.n;S.plan=genPlan(S.planDays,S.mode);save();if(route()==="plan")render();else location.hash="#plan";break;
    case "plan-set":S.planDays=+d.n;S.plan=genPlan(S.planDays,S.mode);save();render();break;
    case "mode":S.mode=d.m;S.plan=genPlan(S.planDays,S.mode);save();render();break;
    case "regen":S.plan=genPlan(S.planDays,S.mode);save();render();break;
    case "swap":swapMeal(+d.d,d.k);break;
    case "rf":RLIM=48;if(d.f==="mine")RF.mine=!RF.mine;else if(d.f==="fav")RF.fav=!RF.fav;else RF[d.f]=d.v;recipeFilters();recipeGrid();break;
    case "gtab":GT=d.t;render();break;
    case "fs":FS=d.s;$("#gbody").innerHTML=guideBody();document.querySelectorAll('[data-act="gtab"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===GT));break;
    case "pp":CUR.p=Math.min(12,Math.max(1,CUR.p+ +d.d));renderRecipe();break;
    case "meth":CUR.m=d.m;renderRecipe();break;
    case "tolist":S.extra.push({id:CUR.id,p:CUR.p});save();toast("Добавено в списъка");closeDlg();if(route()==="list")render();break;
    case "rm-extra":S.extra.splice(+d.i,1);save();render();break;
    case "copy":{const txt=listText();
      const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Списъкът е копиран");}catch(_){toast("Маркирай и копирай ръчно");}ta.remove();};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast("Списъкът е копиран"),fb);else fb();break;}
    case "uncheck":S.checked={};save();render();break;
    case "q-meal":Q.meal=d.v;renderQuick();break;
    case "q-pick":{const i=+d.i;Q.picks.has(i)?Q.picks.delete(i):Q.picks.add(i);t.setAttribute("aria-pressed",Q.picks.has(i));break;}
    case "q-eq":Q.equip[d.m]=Q.equip[d.m]?0:1;t.setAttribute("aria-pressed",!!Q.equip[d.m]);break;
    case "q-time":Q.time=+d.v;renderQuick();break;
    case "q-next":Q.step++;renderQuick();break;
    case "q-back":Q.step=Math.max(1,Q.step-1);renderQuick();break;
    case "set-eq":S.equip[d.m]=S.equip[d.m]?0:1;DIRTY=true;save();t.setAttribute("aria-pressed",!!S.equip[d.m]);break;
    case "set-ppl":S.people=Math.min(6,Math.max(1,S.people+ +d.d));save();render();break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  if(t.dataset.act==="chk"){S.checked[t.dataset.k]=t.checked;if(!t.checked)delete S.checked[t.dataset.k];save();render();}
  if(t.dataset.act==="set-diet"){S[t.dataset.k]=t.checked?1:0;DIRTY=true;save();HOME_IDEA=null;}
});
dlg.addEventListener("close",()=>{if(route()!=="home")render();else render();});
document.addEventListener("input",e=>{
  if(e.target.id==="rq"){RF.q=e.target.value;RLIM=48;recipeGrid();}
  if(e.target.id==="fq"){FQ=e.target.value;$("#fgrid").innerHTML=foodCards(FOOD.map(c=>{const mk=(arr,s)=>arr.map(x=>{const [n,note]=x.split("|");return {n,note,s};});return {c:c.c,items:[...mk(c.ok,"ok"),...mk(c.lim,"lim"),...mk(c.no,"no")].filter(i=>(FS==="all"||i.s===FS)&&(i.n.toLowerCase().includes(FQ.toLowerCase())||c.c.toLowerCase().includes(FQ.toLowerCase())))};}).filter(c=>c.items.length));}
});

applyLook();
if(!S.plan||!S.plan.days)S.plan=genPlan(S.planDays,S.mode);
render();
</script>
